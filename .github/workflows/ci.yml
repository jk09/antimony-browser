name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Allow Chromium's sandbox (Ubuntu 24.04 restricts unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - name: Feature docs and active spec match the code
        if: github.event_name == 'pull_request'
        run: node .claude/scripts/check-done.mjs --base origin/${{ github.base_ref }}
